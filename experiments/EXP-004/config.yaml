# EXP-004 exact configuration.
#
# Copied from the owning modules' unvalidated software defaults, which are
# themselves inherited from EXP-000 so the comparison is controlled.
# These are NOT SIH thresholds, NOT a matcher freeze (D-007), and NOT a
# selected lunar transform (D-010).
# Do not copy these values into configs/default.yaml.
#
# Authoritative source: src/io/exp004/config.py.

experiment_id: EXP-004
inherits_fixed_configuration_from: EXP-000
independent_variable: representation_id
matching_view_held_fixed: true
pair_manifest_id: pair_01_equatorial

hypothesis: >
  H1: On pair_01_equatorial, replacing the EXP-000 intensity representation
  with the existing gradient or structural representation, holding matching-
  view scale, SIFT parameters, Lowe ratio, and geometric verification
  fixed, increases the number of geometrically verified SIFT
  correspondences.
  H0: those representation changes do not increase verified correspondence
  yield on this pair, which would mean intensity is not shown to be the
  pair-01 bottleneck.

decision_rule: >
  The independent variable is valid only if representation_id actually
  differs across A/B/C (intensity / gradient / structural) while matching-
  view strides stay at the EXP-000 baseline (OHRC 15 / LROC 8).
  Representation is treated as improving verified correspondence only if B
  or C produces strictly more verified inliers than A. Equal verified
  counts mean intensity is not shown to be the bottleneck on this pair.
  Four-point DLT residuals are not accuracy. Independent accuracy remains
  NOT VALIDATED. One pair cannot establish a superior representation.

# ---------------------------------------------------------------------------
# Held constant across every variant
# ---------------------------------------------------------------------------
fixed:
  pairs_source: data/manifests/demo_pairs.yaml
  dataset_root_env: CHANDRAYAN_DATA_ROOT
  matcher_id: sift

  preprocessing:
    applied_to_full_rasters: false
    reason: full-raster float64 materialisation exceeds the 16777216-pixel cap
    action: identity_passthrough
    matching_view_stretch_still_applies: true

  matching_view:
    max_pixels_per_image: 4194304
    downsample_method: stride_decimation
    spatial_window: full_image_stride_decimation_not_a_cropped_window
    coordinate_mapping: >
      x_original = x_matching * x_scale; y_original = y_matching * y_scale;
      x_scale = y_scale = stride
    expected_pair_01_strides:
      ohrc: 15
      lroc: 8

  sift:
    nfeatures: 0
    n_octave_layers: 3
    contrast_threshold: 0.04
    edge_threshold: 10.0
    sigma: 1.6
    ratio_threshold: 0.75
    min_matches: 4

  verification:
    model_id: projective_2d_baseline
    estimator_id: ransac_style_baseline
    residual_limit: 3.0
    max_trials: 500
    rng_seed: 0
    confidence_min: null

  control_points:
    grid_bins: 8
    max_per_source_cell: 1
    max_per_reference_cell: 1
    max_points: null

  refinement:
    method_id: zncc_parabolic_baseline
    window_radius: 7
    search_radius: 3
    min_valid_pixel_fraction: 0.75
    min_peak_zncc: 0.25
    fine_half_width: 1.0
    fine_step: 0.1

  registration:
    model_id: projective_2d_baseline
    max_output_pixels: 16777216   # NOT raised by this experiment
    diagnostic_crops_written: false

  evaluation:
    rmse: sqrt(mean(stored inlier verification residuals^2)); not accuracy
    inlier_ratio_denominator: len(CorrespondenceSet.matches)
    spatial_coverage: >
      0.5 * (source_bbox_area / source_image_area +
      reference_bbox_area / reference_image_area)
    independent_ground_truth: false
    independent_accuracy: NOT VALIDATED

# ---------------------------------------------------------------------------
# The independent variable: existing representation_id
# Fixed before the first real-data run and not revisited afterwards.
# Selection uses existing select_representation_id routing. No new module.
# ---------------------------------------------------------------------------
variants:
  A:
    label: exp000_intensity_representation
    representation_id: intensity
    module: src.representation.intensity
    builder: build_intensity_array
    routing_difficulty: null
    routing_rule: difficulty None/easy -> intensity
    pair_for_generate_representation: original_pair
    expected_pair_01_strides:
      ohrc: 15
      lroc: 8
    representation_callable: generate_representation(pair)

  B:
    label: existing_gradient_representation
    representation_id: gradient
    module: src.representation.gradient
    builder: build_gradient_array
    routing_difficulty: normal
    routing_rule: difficulty normal -> gradient
    pair_for_generate_representation: >
      copy with characterization.difficulty=normal; original pair is not mutated
    expected_pair_01_strides:
      ohrc: 15
      lroc: 8
    representation_callable: generate_representation(pair)

  C:
    label: existing_structural_representation
    representation_id: structural
    module: src.representation.structural
    builder: build_structural_array
    routing_difficulty: difficult
    routing_rule: difficulty difficult -> structural
    pair_for_generate_representation: >
      copy with characterization.difficulty=difficult; original pair is not mutated
    expected_pair_01_strides:
      ohrc: 15
      lroc: 8
    representation_callable: generate_representation(pair)
