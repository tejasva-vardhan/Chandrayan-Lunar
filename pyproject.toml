[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sih26166"
version = "0.1.0"
description = "SIH26166 lunar image correspondence scientific core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
    "scipy>=1.11",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "wiring: orchestration wiring tests using doubles; not scientific evidence",
    "scientific: measured or synthetic scientific tests; not official SIH evidence",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "api"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["src", "api"]
